[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdfd-runtime"
version = "1.1.1"
description = "CLI-first public runtime for CDFL execution, finite audit, and reproducible software smoke checks."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Steve Bico Mujjabi, MD" }
]
keywords = [
  "CDFD",
  "CDFL",
  "constraint-driven flux dynamics",
  "scientific computing",
  "finite audit",
  "reproducible research",
  "executable model grammar"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "numba>=0.59",
  "requests>=2.31",
  "scipy>=1.11",
]

[project.optional-dependencies]
experiments = [
  "h5py>=3.10",
  "matplotlib>=3.8",
  "pandas>=2.1",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.5",
  "twine>=5.0",
  "wheel>=0.43",
]
docs = [
  "pdoc>=15.0",
]

[project.scripts]
cdfd = "cdfd:main"

[project.urls]
Homepage = "https://github.com/bampita-bico/CDFD-Runtime"
Repository = "https://github.com/bampita-bico/CDFD-Runtime"
DOI = "https://doi.org/10.5281/zenodo.20343160"

[tool.setuptools]
py-modules = ["cdfd"]
include-package-data = true

[tool.setuptools.packages.find]
include = [
  "docs*",
  "dsl*",
  "engine*",
  "examples*",
  "ontology*",
  "runtime*",
]

[tool.setuptools.package-data]
docs = ["*.md", "*.json", "*.bib"]
examples = ["*.cdfl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
