name: Runtime bug
description: Report a reproducible CDFD Runtime problem.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, inputs, and the exact output or error.
      value: |
        ```bash
        cdfd doctor --json
        ```
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "1.0.1 or commit SHA"
  - type: textarea
    id: boundary
    attributes:
      label: Claim boundary
      description: Is this a runtime/software issue, not a medical/engineering/financial/legal decision request?
    validations:
      required: true
