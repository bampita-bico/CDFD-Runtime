name: ci

on:
  push:
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package and release extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web,experiments]"
          python -m pip check

      - name: Whitespace and generated-matrix checks
        run: |
          git diff --check
          python scripts/generate_domain_matrix.py --check

      - name: Runtime smoke gates
        run: |
          mkdir -p /tmp/cdfd-ci
          cdfd doctor --json --out /tmp/cdfd-ci/doctor.json
          cdfd gallery --json --out /tmp/cdfd-ci/gallery.json
          cdfd compare origins_of_life --scenarios mixed_source_surface_trap meteoritic_seed_retained --json --out /tmp/cdfd-ci/compare.json
          cdfd report /tmp/cdfd-ci/gallery.json --format markdown --out /tmp/cdfd-ci/gallery_report.md
          cdfd explain /tmp/cdfd-ci/gallery.json --format markdown --out /tmp/cdfd-ci/gallery_explain.md
          cdfd cdfl lint examples/heat_flow.cdfl --json
          cdfd cdfl ast examples/heat_flow.cdfl --json
          cdfd cdfl sample --out /tmp/cdfd-ci/sample.cdfl
          cdfd cdfl validate /tmp/cdfd-ci/sample.cdfl --json

      - name: Tests
        run: |
          python -m pytest -q tests/test_cli_runtime.py tests/test_new_engine_upgrades.py tests/test_release_surfaces.py tests/test_cdfl_vscode_extension.py

      - name: Build wheel and sdist
        run: |
          python -m build
          python -m twine check dist/*

      - name: PDF source gate
        run: |
          if command -v latexmk >/dev/null 2>&1; then
            papers/build_pdfs.sh
          else
            test "$(find papers/PDFs -maxdepth 1 -name '*.pdf' | wc -l)" -eq 12
            echo "latexmk not installed; verified 12 committed runtime PDFs"
          fi
