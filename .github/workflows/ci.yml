name: ci

on:
  push:
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package and release extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,experiments]"
          python -m pip check

      - name: Whitespace and paper checks
        run: |
          git diff --check
          python scripts/check_joss_paper.py

      - name: Runtime smoke gates
        run: |
          mkdir -p /tmp/cdfd-ci
          cdfd doctor --json --out /tmp/cdfd-ci/doctor.json
          cdfd gallery --json --out /tmp/cdfd-ci/gallery.json
          cdfd report /tmp/cdfd-ci/gallery.json --format markdown --out /tmp/cdfd-ci/gallery_report.md
          cdfd explain /tmp/cdfd-ci/gallery.json --format markdown --out /tmp/cdfd-ci/gallery_explain.md
          cdfd cdfl lint examples/heat_flow.cdfl --json
          cdfd cdfl ast examples/heat_flow.cdfl --json
          cdfd cdfl sample --out /tmp/cdfd-ci/sample.cdfl
          cdfd cdfl validate /tmp/cdfd-ci/sample.cdfl --json
          python experiments/run_cdfl_smoke.py --out /tmp/cdfd-ci/cdfl_smoke.json

      - name: Tests
        run: |
          python -m pytest -q tests/test_cli_runtime.py tests/test_release_surfaces.py tests/test_joss_submission_assets.py tests/test_cdfl_vscode_extension.py

      - name: Build wheel and sdist
        run: |
          python -m build
          python -m twine check dist/*
